name: Windows build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag to publish after a successful build
        required: false
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run dist:win
      - run: node scripts/smoke-packaged.mjs "release/win-unpacked/DSH Desktop.exe" "release/win-unpacked/resources/app"
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            release/*-Setup.exe
            release/*-Portable.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if (-not $env:RELEASE_TAG) {
            $version = (Get-Content package.json | ConvertFrom-Json).version
            $env:RELEASE_TAG = "v$version"
          }
          $assets = Get-ChildItem release -File |
            Where-Object { $_.Name -match '(-Setup|-Portable)\.exe$|^SHA256SUMS\.txt$' } |
            ForEach-Object { $_.FullName }
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "DSH Desktop $env:RELEASE_TAG" --generate-notes
          }
